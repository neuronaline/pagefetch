[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pagefetch"
version = "1.0.0"
description = "Asynchronous Camoufox-powered web scraping and content extraction library"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PageFetch contributors" }]
keywords = [
  "web-scraping",
  "content-extraction",
  "markdown",
  "async",
  "html-to-markdown",
  "camoufox",
  "browser-automation",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Markup :: HTML",
  "Typing :: Typed",
]
dependencies = [
  "aiosqlite>=0.20,<1",
  "beautifulsoup4>=4.12,<5",
  "camoufox[geoip]>=0.5.6,<1",
  "lxml>=5.2,<6",
  "platformdirs>=4.2,<5",
  "pypdf>=5.0,<6",
  "pyyaml>=6.0,<7",
  "tldextract>=5.1,<6",
]

[project.urls]
Homepage = "https://github.com/neuronaline/pagefetch"
Documentation = "https://github.com/neuronaline/pagefetch#readme"
Repository = "https://github.com/neuronaline/pagefetch.git"
Issues = "https://github.com/neuronaline/pagefetch/issues"

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
pagefetch = "pagefetch.cli:main"

[tool.setuptools.packages.find]
include = ["pagefetch*"]

[tool.setuptools.package-data]
pagefetch = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "ASYNC109"]
